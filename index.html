<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 바코드 스캐너</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f5f5f5; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border: 2px solid #333; border-radius: 8px; overflow: hidden; background: #000; }
        #result { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; color: #0056b3; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); word-break: break-all; }
        .btn { padding: 10px 20px; font-size: 1rem; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>바코드 스캐너</h1>
    <button class="btn" id="start-btn">스캐너 시작</button>
    <div id="reader" style="display:none;"></div>
    <div id="result">아래 버튼을 눌러 카메라를 켜주세요.</div>

<script>
let html5QrCode;

document.getElementById('start-btn').addEventListener('click', function() {
    // 1. HTTPS 및 localhost 보안 환경 사전 체크
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        alert("카메라 기능은 HTTPS 환경에서만 작동합니다.");
        document.getElementById('result').innerText = "보안 오류: HTTPS 환경이 아닙니다.";
        document.getElementById('result').style.color = 'red';
        return;
    }

    const readerDiv = document.getElementById('reader');
    const resultDiv = document.getElementById('result');
    const startBtn = this;

    readerDiv.style.display = 'block';
    startBtn.style.display = 'none';
    resultDiv.innerText = '카메라 권한 승인 대기 중...';

    // 2. 기존 인스턴스가 있다면 정리 후 새로 생성
    if (html5QrCode) {
        html5QrCode.clear();
    }
    html5QrCode = new Html5Qrcode("reader");

    // 3. 직사각형 바코드 스캔을 위한 모바일 최적화 설정
    const config = { 
        fps: 10, // 스캔 주기를 살짝 낮춰 모바일 기기 발열 및 부하 감소
        qrbox: function(viewfinderWidth, viewfinderHeight) {
            return { 
                width: Math.floor(viewfinderWidth * 0.85), 
                height: Math.floor(viewfinderHeight * 0.45) 
            };
        },
        aspectRatio: 1.0
    };

    // 4. 스캐너 구동
    html5QrCode.start(
        { facingMode: "environment" }, // 후면 카메라 우선 배치
        config,
        (decodedText) => {
            // 스캔 성공 시
            resultDiv.innerText = `스캔 결과: ${decodedText}`;
            resultDiv.style.color = '#0056b3';
            
            // 진동 피드백
            if (navigator.vibrate) {
                navigator.vibrate(100); 
            }
        },
        (errorMessage) => {
            // 매 프레임 발생하는 인식 실패(No barcode found) 메시지는 콘솔에만 출력하여 과부하 방지
            console.debug("인식 시도 중...");
        }
    ).then(() => {
        // 성공적으로 카메라가 켜졌을 때 문구 변경
        resultDiv.innerText = "바코드를 사각형 안에 맞춰주세요.";
    }).catch((err) => {
        // 카메라 권한 거부 또는 하드웨어 에러 발생 시
        readerDiv.style.display = 'none';
        startBtn.style.display = 'block';
        resultDiv.innerText = `카메라 에러: ${err}\n(권한을 허용했는지 확인해주세요.)`;
        resultDiv.style.color = 'red';
    });
});
</script>
</body>
</html>
