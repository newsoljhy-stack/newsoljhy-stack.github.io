<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>MQTT Publish Test</title>

<!-- mqtt.js -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <h2>Web MQTT Publisher 테스트</h2>

<div>
    <button onclick="connectMQTT()">1. 브로커 연결</button>
    <span id="status" style="color:red;font-weight:bold;">
        연결 안 됨
    </span>
</div>

<br>

<div>
    <label>토픽</label>
    <input id="topic" value="test/topic">

    <br><br>

    <label>메시지</label>
    <input id="message" value="Hello World!">

    <br><br>

    <button id="pubBtn" onclick="publishMessage()" disabled>
        2. 메시지 발행
    </button>
</div>

<script>
let client = null;

function connectMQTT() {

    // HiveMQ Public Broker(WebSocket)
    const brokerUrl = "wss://broker.hivemq.com:8884/mqtt";

    const options = {
        clientId: "web_" + Math.random().toString(16).substring(2,10),
        clean: true,
        reconnectPeriod: 3000,
        connectTimeout: 5000
    };

    document.getElementById("status").innerText = "연결 중...";
    document.getElementById("status").style.color = "orange";

    client = mqtt.connect(brokerUrl, options);

    client.on("connect", () => {

        console.log("Connected");

        document.getElementById("status").innerText = "연결 완료";
        document.getElementById("status").style.color = "green";
        document.getElementById("pubBtn").disabled = false;

    });

    client.on("reconnect", () => {
        console.log("Reconnecting...");
    });

    client.on("error", (err) => {

        console.error(err);

        document.getElementById("status").innerText = "연결 실패";
        document.getElementById("status").style.color = "red";
    });

    client.on("close", () => {

        document.getElementById("status").innerText = "연결 종료";
        document.getElementById("status").style.color = "red";
        document.getElementById("pubBtn").disabled = true;

    });
}

function publishMessage() {

    if (!client || !client.connected) {
        alert("먼저 브로커에 연결하세요.");
        return;
    }

    const topic = document.getElementById("topic").value;
    const message = document.getElementById("message").value;

    client.publish(topic, message, { qos: 0 }, (err) => {

        if (err) {
            console.error(err);
            alert("발행 실패");
            return;
        }

        console.log("Published:", topic, message);
        alert("발행 성공");
    });

}
</script>

</body>
</html>
