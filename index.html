<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 바코드 스캐너 (MQTT)</title>
    <!-- html5-qrcode 최신 안정화 CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Paho MQTT 웹소켓 클라이언트 CDN 추가 -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f5f5f5; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border: 2px solid #333 !important; border-radius: 8px; overflow: hidden; background: #000; }
        #reader button { padding: 10px 20px; font-size: 1rem; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        #reader select { padding: 8px; margin: 5px; border-radius: 4px; }
        #result { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; color: #555; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); word-break: break-all; }
        .success-text { color: #28a745; }
        /* MQTT 상태 표시 스타일 */
        #mqtt-status { font-size: 0.9rem; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>바코드 스캐너</h1>
    <!-- MQTT 연결 상태 표시 영역 -->
    <div id="mqtt-status">MQTT 브로커 연결 중...</div>
    <div id="reader"></div>
    <div id="result">카메라 시작 버튼을 눌러주세요.</div>

    <script>
        // --- 1. MQTT 설정 ---
        // 브라우저 환경에서는 웹소켓(WebSocket) 전송 프로토콜과 전용 포트를 사용해야 합니다.
        const MQTT_HOST = "://hivemq.com"; // 공용 테스트 브로커 주소
        const MQTT_PORT = 8000;                // 웹소켓 포트 (일반 1883 포트는 브라우저에서 불가)
        const MQTT_TOPIC = "scanner/barcode/data"; // 발행할 토픽명
        let mqttClient;

        function initMQTT() {
            const clientId = "scanner_" + Math.random().toString(16).substr(2, 8);
            mqttClient = new Paho.MQTT.Client(MQTT_HOST, Number(MQTT_PORT), clientId);

            // 연결 유실 콜백
            mqttClient.onConnectionLost = function (responseObject) {
                document.getElementById('mqtt-status').innerText = "MQTT 연결 유실! 재연결 시도 중...";
                setTimeout(initMQTT, 3000); // 3초 후 재연결 시도
            };

            // 브로커 연결
            mqttClient.connect({
                onSuccess: function () {
                    document.getElementById('mqtt-status').innerText = `MQTT 연결 완료 (${MQTT_HOST})`;
                    document.getElementById('mqtt-status').style.color = "#28a745";
                },
                onFailure: function (message) {
                    document.getElementById('mqtt-status').innerText = "MQTT 연결 실패: " + message.errorMessage;
                    document.getElementById('mqtt-status').style.color = "#dc3545";
                    setTimeout(initMQTT, 5000); // 실패 시 5초 후 재시도
                },
                useSSL: false // https 환경일 경우 true로 변경하고 포트도 SSL 웹소켓 포트(예: 8884)로 변경해야 합니다.
            });
        }

        // MQTT 데이터 발행 함수
        function publishBarcode(data) {
            if (mqttClient && mqttClient.isConnected()) {
                const message = new Paho.MQTT.Message(data);
                message.destinationName = MQTT_TOPIC;
                mqttClient.send(message);
                console.log(`MQTT 발행 성공 [${MQTT_TOPIC}]: ${data}`);
            } else {
                console.warn("MQTT 브로커에 연결되어 있지 않아 발행을 건너뜁니다.");
            }
        }

        // --- 2. 스캐너 및 로직 초기화 ---
        document.addEventListener("DOMContentLoaded", function() {
            // 페이지 로드 시 MQTT 시작
            initMQTT();

            const html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { 
                    fps: 10, 
                    qrbox: { width: 280, height: 140 }, 
                    aspectRatio: 1.0, 
                    rememberLastUsedCamera: true, 
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA] 
                }, 
                /* verbose= */ false
            );

            // 스캔 성공 시 콜백 함수
            function onScanSuccess(decodedText, decodedResult) {
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `스캔 결과: <span class="success-text">${decodedText}</span>`;
                
                // 모바일 진동 피드백
                if (navigator.vibrate) {
                    navigator.vibrate(100);
                }

                // MQTT로 스캔한 바코드 데이터 발행
                publishBarcode(decodedText);
            }

            // 스캔 실패 시 콜백 함수
            function onScanFailure(error) {
                // 무시 처리
            }

            html5QrcodeScanner.render(onScanSuccess, onScanFailure);

            setTimeout(() => {
                const resultDiv = document.getElementById('result');
                resultDiv.innerText = "상단 스캐너 화면의 안내에 따라주세요.";
            }, 100);
        });
    </script>
</body>
</html>
