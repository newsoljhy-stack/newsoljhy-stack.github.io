<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로컬 모바일 바코드 스캐너</title>
    <script src="https://unpkg.com"></script>
    <script src="https://cloudflare.com" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f5f5f5; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border: 2px solid #333 !important; border-radius: 8px; overflow: hidden; background: #000; }
        #reader button { padding: 10px 20px; font-size: 1rem; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        #result { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; color: #555; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); word-break: break-all; }
        .success-text { color: #28a745; }
        #mqtt-status { font-size: 0.9rem; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>로컬 바코드 스캐너</h1>
    <div id="mqtt-status">로컬 MQTT 브로커 연결 중...</div>
    <div id="reader"></div>
    <div id="result">카메라 시작 버튼을 눌러주세요.</div>

    <script>
        // --- 💡 [필수 변경] 로컬 MQTT 설정 ---
        // Mosquitto가 설치된 PC의 사설 IP 주소를 입력하세요 (예: 192.168.0.X)
        // 스마트폰과 PC가 '같은 와이파이(공유기)'에 연결되어 있어야 합니다.
        const MQTT_HOST = "192.168.0.165"; 
        const MQTT_PORT = 8000; // mosquitto.conf에 설정한 웹소켓 포트
        const MQTT_TOPIC = "scanner/barcode/data";
        let mqttClient;

        function initMQTT() {
            const clientId = "scanner_mobile_" + Math.random().toString(16).substr(2, 8);
            mqttClient = new Paho.MQTT.Client(MQTT_HOST, Number(MQTT_PORT), clientId);

            mqttClient.onConnectionLost = function (responseObject) {
                document.getElementById('mqtt-status').innerText = "MQTT 연결 유실! 재연결 시도 중...";
                setTimeout(initMQTT, 3000);
            };

            mqttClient.connect({
                onSuccess: function () {
                    document.getElementById('mqtt-status').innerText = `로컬 MQTT 연결 완료 (${MQTT_HOST}:${MQTT_PORT})`;
                    document.getElementById('mqtt-status').style.color = "#28a745";
                },
                onFailure: function (message) {
                    document.getElementById('mqtt-status').innerText = "로컬 MQTT 연결 실패: " + message.errorMessage;
                    document.getElementById('mqtt-status').style.color = "#dc3545";
                    setTimeout(initMQTT, 5000);
                },
                useSSL: false // 로컬 테스트는 일반 웹소켓(ws://)을 사용하므로 false
            });
        }

        function publishBarcode(data) {
            if (mqttClient && mqttClient.isConnected()) {
                const message = new Paho.MQTT.Message(data);
                message.destinationName = MQTT_TOPIC;
                mqttClient.send(message);
                console.log(`로컬 MQTT 발행 성공: ${data}`);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            initMQTT();

            const html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: { width: 280, height: 140 }, aspectRatio: 1.0, rememberLastUsedCamera: true }, false
            );

            html5QrcodeScanner.render(function onScanSuccess(decodedText) {
                document.getElementById('result').innerHTML = `스캔 결과: <span class="success-text">${decodedText}</span>`;
                if (navigator.vibrate) navigator.vibrate(100);
                publishBarcode(decodedText); // 스캔 즉시 데이터 발행
            }, function onScanFailure(error) {});
        });
    </script>
</body>
</html>
