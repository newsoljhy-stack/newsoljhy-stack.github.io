<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 바코드 스캐너 (MQTT 생성자 교정형)</title>
    <!-- html5-qrcode 최신 안정화 CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
   
    
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f5f5f5; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border: 2px solid #333 !important; border-radius: 8px; overflow: hidden; background: #000; }
        #reader button { padding: 10px 20px; font-size: 1rem; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        #result { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; color: #555; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); word-break: break-all; }
        .success-text { color: #28a745; }
        #mqtt-status { font-size: 0.9rem; color: #666; margin-top: 10px; font-weight: bold; }
    </style>

    <!-- 1. Mosquitto 2.x 서브프로토콜 연동 규격 호환 원본 소스코드 내장 -->
    <script>
    var Paho=Paho||{};Paho.MQTT=Paho.MQTT||{},Paho.MQTT.Client=function(t,e,n,i){if(arguments.length<2||arguments.length>4)throw new Error("Invalid number of arguments to Client constructor");"object"==typeof t?(this.host=t.host,this.port=Number(t.port),this.path=t.path||"/mqtt",this.clientId=e):(this.host=t,this.port=Number(e),this.clientId=n,this.path=i||"/mqtt");if(!this.clientId)throw new Error("clientId must be specified");var r=this,s=null;this.onConnectionLost=null,this.onMessageArrived=null,this.connect=function(t){var e={keepAliveInterval:60,cleanSession:!0,useSSL:!1,onSuccess:null,onFailure:null};if(t)for(var n in t)e[n]=t[n];var i="ws"+(e.useSSL?"s":"")+"://"+r.host+":"+r.port+r.path;s=new WebSocket(i,["mqtt"]),s.binaryType="arraybuffer",s.onopen=function(){r.connected=!0,e.onSuccess&&e.onSuccess()},s.onclose=function(t){r.connected=!1,r.onConnectionLost&&r.onConnectionLost({errorCode:t.code,errorMessage:t.reason})},s.onerror=function(t){e.onFailure&&e.onFailure({errorCode:-1,errorMessage:"WebSocket Error"})},s.onmessage=function(t){if(r.onMessageArrived){var e=new Paho.MQTT.Message(t.data);r.onMessageArrived(e)}}},this.disconnect=function(){s&&s.close()},this.send=function(t,e,n,i){if(!r.connected)throw new Error("Client is not connected");var o;if("string"==typeof t)o=new Paho.MQTT.Message(t),o.destinationName=e;else{if(!(t instanceof Paho.MQTT.Message))throw new Error("Invalid msg type");o=t}s.send(o.payloadString)},this.isConnected=function(){return r.connected}},Paho.MQTT.Message=function(t){this.payloadString=t,this.destinationName=""};
    </script>
</head>
<body>
    <h1>바코드 스캐너</h1>
    <!-- MQTT 연결 상태 표시 영역 -->
    <div id="mqtt-status">MQTT 브로커 연결 중...</div>
    <div id="reader"></div>
    <div id="result">카메라 시작 버튼을 눌러주세요.</div>

    <script>
        // --- 2. MQTT 설정 ---
        const MQTT_HOST = "192.168.0.165"; 
        const MQTT_PORT = 8000;                
        const MQTT_TOPIC = "scanner/barcode/data"; 
        let mqttClient;

        function initMQTT() {
            const clientId = "scanner_" + Math.random().toString(16).substr(2, 8);
            
            try {
                // ⭕ [교정] 매개변수 순서를 정확히 배치하여 호스트, 포트, 클라이언트ID 순으로 빌드합니다.
                // 세 번째 인자는 고정 경로인 "/mqtt", 네 번째 인자로 clientId를 전달합니다.
                mqttClient = new Paho.MQTT.Client(MQTT_HOST, Number(MQTT_PORT), clientId, "/mqtt");

                mqttClient.onConnectionLost = function (responseObject) {
                    document.getElementById('mqtt-status').innerText = "MQTT 연결 유실! 재연결 시도 중...";
                    document.getElementById('mqtt-status').style.color = "#dc3545";
                    setTimeout(initMQTT, 3000); 
                };

                mqttClient.connect({
                    onSuccess: function () {
                        document.getElementById('mqtt-status').innerText = `MQTT 연결 완료 (${MQTT_HOST}:${MQTT_PORT})`;
                        document.getElementById('mqtt-status').style.color = "#28a745";
                    },
                    onFailure: function (message) {
                        document.getElementById('mqtt-status').innerText = "MQTT 연결 실패: 서버 설정을 다시 확인하세요.";
                        document.getElementById('mqtt-status').style.color = "#dc3545";
                        setTimeout(initMQTT, 5000); 
                    },
                    useSSL: false 
                });
            } catch (e) {
                document.getElementById('mqtt-status').innerText = "초기화 에러: " + e.message;
                document.getElementById('mqtt-status').style.color = "#dc3545";
            }
        }

        function publishBarcode(data) {
            if (mqttClient && mqttClient.isConnected()) {
                const message = new Paho.MQTT.Message(data);
                message.destinationName = MQTT_TOPIC;
                mqttClient.send(message);
                console.log(`MQTT 발행 성공 [${MQTT_TOPIC}]: ${data}`);
            } else {
                alert("로컬 MQTT 브로커와 연결되어 있지 않습니다. 상단 상태창을 확인하세요.");
            }
        }

        // --- 3. 스캐너 및 로직 초기화 ---
        document.addEventListener("DOMContentLoaded", function() {
            initMQTT();

            const html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: { width: 280, height: 140 }, aspectRatio: 1.0, rememberLastUsedCamera: true }, false
            );

            html5QrcodeScanner.render(function onScanSuccess(decodedText) {
                document.getElementById('result').innerHTML = `스캔 결과: <span class="success-text">${decodedText}</span>`; 
                if (navigator.vibrate) navigator.vibrate(100);
                
                // 바코드 스캔 데이터 전송 실행
                publishBarcode(decodedText); 
            }, function onScanFailure(error) {});
        });
    </script>
</body>
</html>
