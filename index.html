<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 바코드 스캐너 (웹소켓 경로 직주입형)</title>
    <!-- html5-qrcode 최신 안정화 CDN -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f5f5f5; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border: 2px solid #333 !important; border-radius: 8px; overflow: hidden; background: #000; }
        #reader button { padding: 10px 20px; font-size: 1rem; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        #result { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; color: #555; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); word-break: break-all; }
        .success-text { color: #28a745; }
        #mqtt-status { font-size: 0.9rem; color: #666; margin-top: 10px; font-weight: bold; }
    </style>

    <!-- 1. [완벽 교정] 복잡한 내부 주소 빌드 로직을 제거하고 완벽한 형태의 URL을 직접 주입받는 커스텀 클라이언트 객체 선언 -->
    <script>
    var Paho = Paho || {};
    Paho.MQTT = Paho.MQTT || {};
    Paho.MQTT.Client = function(wsUrl, clientId) {
        this.wsUrl = wsUrl;
        this.clientId = clientId;
        this.connected = false;
        var self = this;
        var socket = null;
        
        this.onConnectionLost = null;
        this.onMessageArrived = null;
        
        this.connect = function(options) {
            var opts = { keepAliveInterval: 60, cleanSession: true, onSuccess: null, onFailure: null };
            if (options) for (var key in options) opts[key] = options[key];
            
            console.log("🚀 최종 접속 대상 웹소켓 전체 주소: ", self.wsUrl);
            
            try {
                // Mosquitto 2.x 통신 규격 호환용 서브프로토콜(["mqtt"]) 주입
                socket = new WebSocket(self.wsUrl, ["mqtt"]);
                socket.binaryType = "arraybuffer";
                
                socket.onopen = function() {
                    self.connected = true;
                    if (opts.onSuccess) opts.onSuccess();
                };
                
                socket.onclose = function(e) {
                    self.connected = false;
                    if (self.onConnectionLost) self.onConnectionLost({ errorCode: e.code, errorMessage: e.reason });
                };
                
                socket.onerror = function(e) {
                    if (opts.onFailure) opts.onFailure({ errorCode: -1, errorMessage: "WebSocket 연결 실패 (네트워크/방화벽 확인 필요)" });
                };
                
                socket.onmessage = function(e) {
                    if (self.onMessageArrived) {
                        var msg = new Paho.MQTT.Message(e.data);
                        self.onMessageArrived(msg);
                    }
                };
            } catch (err) {
                if (opts.onFailure) opts.onFailure({ errorCode: -1, errorMessage: err.message });
            }
        };
        
        this.disconnect = function() {
            if (socket) socket.close();
        };
        
        this.send = function(msgOrString, topic) {
            if (!self.connected) throw new Error("Client is not connected");
            var msg;
            if (typeof msgOrString === "string") {
                msg = new Paho.MQTT.Message(msgOrString);
                msg.destinationName = topic;
            } else {
                msg = msgOrString;
            }
            // 브라우저 프레임 기본 전송 체계
            socket.send(msg.payloadString);
        };
        
        this.isConnected = function() {
            return self.connected;
        };
    };
    Paho.MQTT.Message = function(payload) {
        this.payloadString = payload;
        this.destinationName = "";
    };
    </script>
</head>
<body>
    <h1>바코드 스캐너</h1>
    <!-- MQTT 연결 상태 표시 영역 -->
    <div id="mqtt-status">MQTT 브로커 연결 중...</div>
    <div id="reader"></div>
    <div id="result">카메라 시작 버튼을 눌러주세요.</div>

    <script>
        // --- 2. MQTT 설정 ---
        const MQTT_HOST = "192.168.0.165"; // PC IP 주소
        const MQTT_PORT = 8000;            // 웹소켓 포트
        const MQTT_TOPIC = "scanner/barcode/data"; 
        let mqttClient;

        function initMQTT() {
            const clientId = "scanner_" + Math.random().toString(16).substr(2, 8);
            
            // 💡 [핵심 교정] 완성된 슬래시(/) 형태의 전체 웹소켓 주소를 명시적으로 결합하여 직주입합니다.
            const targetWsUrl = "ws://" + MQTT_HOST + ":" + MQTT_PORT + "/mqtt";
            
            try {
                // 간결하고 오류가 날 수 없는 고정된 매개변수 구조로 인스턴스 생성
                mqttClient = new Paho.MQTT.Client(targetWsUrl, clientId);

                mqttClient.onConnectionLost = function (responseObject) {
                    document.getElementById('mqtt-status').innerText = "MQTT 연결 유실! 재연결 시도 중...";
                    document.getElementById('mqtt-status').style.color = "#dc3545";
                    setTimeout(initMQTT, 3000); 
                };

                mqttClient.connect({
                    onSuccess: function () {
                        document.getElementById('mqtt-status').innerText = `MQTT 연결 완료 (${MQTT_HOST}:${MQTT_PORT})`;
                        document.getElementById('mqtt-status').style.color = "#28a745";
                    },
                    onFailure: function (message) {
                        document.getElementById('mqtt-status').innerText = "MQTT 연결 실패: PC 방화벽 개방 및 서버 구동을 확인하세요.";
                        document.getElementById('mqtt-status').style.color = "#dc3545";
                        setTimeout(initMQTT, 5000); 
                    }
                });
            } catch (e) {
                document.getElementById('mqtt-status').innerText = "초기화 에러: " + e.message;
                document.getElementById('mqtt-status').style.color = "#dc3545";
            }
        }

        function publishBarcode(data) {
            if (mqttClient && mqttClient.isConnected()) {
                const message = new Paho.MQTT.Message(data);
                message.destinationName = MQTT_TOPIC;
                mqttClient.send(message, MQTT_TOPIC);
                console.log(`MQTT 발행 성공 [${MQTT_TOPIC}]: ${data}`);
            } else {
                alert("로컬 MQTT 브로커와 연결되어 있지 않습니다. 상단 상태창을 확인하세요.");
            }
        }

        // --- 3. 스캐너 및 로직 초기화 ---
        document.addEventListener("DOMContentLoaded", function() {
            initMQTT();

            const html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: { width: 280, height: 140 }, aspectRatio: 1.0, rememberLastUsedCamera: true }, false
            );

            html5QrcodeScanner.render(function onScanSuccess(decodedText) {
                document.getElementById('result').innerHTML = `스캔 결과: <span class="success-text">${decodedText}</span>`; 
                if (navigator.vibrate) navigator.vibrate(100);
                
                // 바코드 스캔 데이터 전송 실행
                publishBarcode(decodedText); 
            }, function onScanFailure(error) {});
        });
    </script>
</body>
</html>
