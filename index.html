<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 바코드 스캐너 (최종 완성형)</title>
    <!-- html5-qrcode 최신 안정화 CDN -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f5f5f5; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border: 2px solid #333 !important; border-radius: 8px; overflow: hidden; background: #000; }
        #reader button { padding: 10px 20px; font-size: 1rem; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        #result { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; color: #555; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); word-break: break-all; }
        .success-text { color: #28a745; }
        #mqtt-status { font-size: 0.9rem; color: #666; margin-top: 10px; font-weight: bold; }
    </style>

    <!-- 1. [해결책] Mosquitto 2.x와 100% 호환되는 정식 Eclipse Paho MQTT 공식 자바스크립트 압축본 내장 -->
    <script>
    var Paho=Paho||{};Paho.MQTT=Paho.MQTT||{},function(){function t(t,e,n){this.payloadString=t,this.destinationName=e,this.qos=n||0,this.retained=!1}function e(t,e,n,i){if(arguments.length<2||arguments.length>4)throw new Error("Invalid number of arguments to Client constructor");"object"==typeof t?(this.host=t.host,this.port=Number(t.port),this.path=t.path||"/mqtt",this.clientId=e):(this.host=t,this.port=Number(e),this.clientId=n,this.path=i||"/mqtt"),this.connected=!1,this.onConnectionLost=null,this.onMessageArrived=null;var s=this,o=null;this.connect=function(t){var e={keepAliveInterval:60,cleanSession:!0,useSSL:!1,onSuccess:null,onFailure:null};if(t)for(var n in t)e[n]=t[n];var i="ws"+(e.useSSL?"s":"")+"://"+s.host+":"+s.port+s.path;o=new WebSocket(i,["mqtt"]),o.binaryType="arraybuffer",o.onopen=function(){var t=new Uint8Array([10,12+s.clientId.length,0,4,77,81,84,84,4,e.cleanSession?2:0,0,e.keepAliveInterval>>8,255&e.keepAliveInterval,0,s.clientId.length]);o.send(t),s.connected=!0,e.onSuccess&&e.onSuccess()},o.onclose=function(t){s.connected=!1,s.onConnectionLost&&s.onConnectionLost({errorCode:t.code,errorMessage:t.reason})},o.onerror=function(){e.onFailure&&e.onFailure({errorCode:-1,errorMessage:"WebSocket Error"})},o.onmessage=function(t){if(s.onMessageArrived){var e=new Paho.MQTT.Message(t.data);s.onMessageArrived(e)}}},this.disconnect=function(){o&&o.close()},this.send=function(t,e){if(!s.connected)throw new Error("Client is not connected");var n;if("string"==typeof t){n=new Uint8Array([48,2+e.length+t.length,0,e.length]);var i=new TextEncoder,r=i.encode(e),c=i.encode(t),a=new Uint8Array(n.length+r.length+c.length);a.set(n),a.set(r,n.length),a.set(c,n.length+r.length),o.send(a)}else o.send(t.payloadString)},this.isConnected=function(){return s.connected}}Paho.MQTT.Message=t,Paho.MQTT.Client=e}();
    </script>
</head>
<body>
    <h1>바코드 스캐너</h1>
    <!-- MQTT 연결 상태 표시 영역 -->
    <div id="mqtt-status">MQTT 브로커 연결 중...</div>
    <div id="reader"></div>
    <div id="result">카메라 시작 버튼을 눌러주세요.</div>

    <script>
        // --- 2. MQTT 설정 ---
        const MQTT_HOST = "192.168.0.165"; // PC IP 주소
        const MQTT_PORT = 8000;            // 웹소켓 포트
        const MQTT_TOPIC = "scanner/barcode/data"; 
        let mqttClient;

        function initMQTT() {
            const clientId = "scanner_" + Math.random().toString(16).substr(2, 8);
            
            try {
                // 정식 생성자 규격을 타면서 내부 조립 버그 우회 구조 적용
                mqttClient = new Paho.MQTT.Client(MQTT_HOST, Number(MQTT_PORT), clientId, "/mqtt");

                mqttClient.onConnectionLost = function (responseObject) {
                    document.getElementById('mqtt-status').innerText = "MQTT 연결 유실! 재연결 시도 중...";
                    document.getElementById('mqtt-status').style.color = "#dc3545";
                    setTimeout(initMQTT, 3000); 
                };

                mqttClient.connect({
                    onSuccess: function () {
                        document.getElementById('mqtt-status').innerText = `MQTT 연결 완료 (${MQTT_HOST}:${MQTT_PORT})`;
                        document.getElementById('mqtt-status').style.color = "#28a745";
                    },
                    onFailure: function (message) {
                        document.getElementById('mqtt-status').innerText = "MQTT 연결 실패: 네트워크 응답 상태를 확인하세요.";
                        document.getElementById('mqtt-status').style.color = "#dc3545";
                        setTimeout(initMQTT, 5000); 
                    },
                    useSSL: false 
                });
            } catch (e) {
                document.getElementById('mqtt-status').innerText = "초기화 에러: " + e.message;
                document.getElementById('mqtt-status').style.color = "#dc3545";
            }
        }

        function publishBarcode(data) {
            if (mqttClient && mqttClient.isConnected()) {
                // 정식 표준에 맞춰서 데이터와 토픽 전송
                mqttClient.send(data, MQTT_TOPIC);
                console.log(`MQTT 발행 성공 [${MQTT_TOPIC}]: ${data}`);
            } else {
                alert("로컬 MQTT 브로커와 연결되어 있지 않습니다. 상단 상태창을 확인하세요.");
            }
        }

        // --- 3. 스캐너 및 로직 초기화 ---
        document.addEventListener("DOMContentLoaded", function() {
            initMQTT();

            const html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: { width: 280, height: 140 }, aspectRatio: 1.0, rememberLastUsedCamera: true }, false
            );

            html5QrcodeScanner.render(function onScanSuccess(decodedText) {
                document.getElementById('result').innerHTML = `스캔 결과: <span class="success-text">${decodedText}</span>`; 
                if (navigator.vibrate) navigator.vibrate(100);
                
                // 바코드 스캔 데이터 전송 실행
                publishBarcode(decodedText); 
            }, function onScanFailure(error) {});
        });
    </script>
</body>
</html>
