<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 바코드 스캐너 & MQTT 발행</title>
    <!-- 외부 라이브러리 CDN (html5-qrcode & mqtt.js) -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f5f5f5; }
        
        /* 스캐너 박스 디자인 */
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border: 2px solid #333 !important; border-radius: 8px; overflow: hidden; background: #000; }
        #reader button { padding: 10px 20px; font-size: 1rem; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        #reader select { padding: 8px; margin: 5px; border-radius: 4px; }
        
        /* 설정 및 결과 UI 영역 */
        .config-box { max-width: 400px; margin: 0 auto 20px auto; padding: 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: left; }
        .config-item { margin-bottom: 10px; display: flex; align-items: center; }
        .config-item label { width: 80px; font-weight: bold; font-size: 0.9rem; }
        .config-item input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        
        #status-container { text-align: center; margin-bottom: 10px; font-weight: bold; }
        #result { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; color: #555; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); word-break: break-all; }
        .success-text { color: #28a745; }
    </style>
</head>
<body>

    <h1>바코드 MQTT 발행기</h1>
    
    <!-- MQTT 설정 및 상태 창 -->
    <div class="config-box">
        <div id="status-container">
            MQTT 상태: <span id="status" style="color:red;">연결 안 됨 (카메라 시작 시 연결)</span>
        </div>
        <div class="config-item">
            <label for="topic">발행 토픽</label>
            <input id="topic" value="myunique/test/topic">
        </div>
    </div>
    
    <!-- 라이브러리가 UI를 직접 제어하는 영역 -->
    <div id="reader"></div>
    
    <!-- 스캔 결과 영역 -->
    <div id="result">카메라 시작 버튼을 눌러주세요.</div>

<script>
let client = null;

// 1. MQTT 브로커 연결 함수
function connectMQTT() {
    if (client && client.connected) return;

    const brokerUrl = "wss://broker.hivemq.com:8884/mqtt";
    const options = {
        clientId: "web_bc_" + Math.random().toString(16).substring(2,10),
        clean: true,
        reconnectPeriod: 3000,
        connectTimeout: 5000
    };

    const statusEl = document.getElementById("status");
    statusEl.innerText = "연결 중...";
    statusEl.style.color = "orange";

    client = mqtt.connect(brokerUrl, options);

    client.on("connect", () => {
        console.log("MQTT Connected");
        statusEl.innerText = "연결 완료";
        statusEl.style.color = "green";
    });

    client.on("reconnect", () => {
        console.log("MQTT Reconnecting...");
        statusEl.innerText = "재연결 중...";
        statusEl.style.color = "orange";
    });

    client.on("error", (err) => {
        console.error(err);
        statusEl.innerText = "연결 실패";
        statusEl.style.color = "red";
    });

    client.on("close", () => {
        console.log("MQTT Closed");
        statusEl.innerText = "연결 종료";
        statusEl.style.color = "red";
    });
}

// 2. MQTT 메시지 발행 함수
function publishMessage(scannedData) {
    if (!client || !client.connected) {
        console.warn("MQTT 미연결 상태로 발행 불가");
        return;
    }

    const topic = document.getElementById("topic").value;
    
    client.publish(topic, scannedData, { qos: 0 }, (err) => {
        if (err) {
            console.error("발행 실패:", err);
            return;
        }
        console.log("발행 성공 - 토픽:", topic, "데이터:", scannedData);
    });
}

// 3. 바코드 스캐너 초기화 및 동작
document.addEventListener("DOMContentLoaded", function() {
    
    const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
        const minEdgePercentage = 0.7; 
        const boxWidth = Math.floor(viewfinderWidth * minEdgePercentage);
        const boxHeight = Math.floor(boxWidth * 0.5);
        return { width: boxWidth, height: boxHeight };
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
            fps: 15, 
            qrbox: qrboxFunction, 
            aspectRatio: 1.333334,
            rememberLastUsedCamera: true,
            supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
            formatsToSupport: [ 
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.QR_CODE
            ]
        },
        /* verbose= */ false
    );

    // 스캔 성공 시 콜백 함수
    function onScanSuccess(decodedText, decodedResult) {
        // 화면에 결과 표시
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `스캔 데이터: <span class="success-text">${decodedText}</span>`;
        
        // 진동 피드백
        if (navigator.vibrate) {
            navigator.vibrate(100);
        }

        // MQTT 발행 프로세스 실행
        publishMessage(decodedText);
    }

    function onScanFailure(error) {
        // 가부하 방지 비워둠
    }

    // 스캐너 렌더링
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    
    // 라이브러리 내부 버튼(카메라 시작 버튼) 클릭을 감지하여 MQTT 연결 트리거
    setTimeout(() => {
        const resultDiv = document.getElementById('result');
        resultDiv.innerText = "상단 스캐너 화면의 안내에 따라주세요.";
        
        // html5-qrcode가 생성한 카메라 시작 버튼 찾기
        const startBtn = document.getElementById("html5-qrcode-button-camera-start");
        if(startBtn) {
            startBtn.addEventListener("click", connectMQTT);
        }
    }, 500);
});
</script>
</body>
</html>
