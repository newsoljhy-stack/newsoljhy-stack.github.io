<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 웹 바코드 스캐너</title>
    <!-- 고성능 오픈소스 바코드 스캔 라이브러리 로드 -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 20px; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border: 2px solid #ccc; }
        #result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: blue; }
    </style>
</head>
<body>

    <h1>웹 바코드 스캐너</h1>
    <!-- 카메라 영상이 표시될 영역 -->
    <div id="reader"></div>
    <!-- 스캔된 결과가 출력될 영역 -->
    <div id="result">바코드를 스캔하세요.</div>

    <script>
        // 바코드 스캔 성공 시 실행될 콜백 함수
        function onScanSuccess(decodedText, decodedResult) {
            // 스캔된 텍스트 화면에 표시
            document.getElementById('result').innerText = `스캔 성공: ${decodedText}`;
            
            // [참고] 이곳에 서버 DB로 데이터를 전송하는 Ajax/Fetch 코드를 작성합니다.
            // example: fetch('/api/inventory', { method: 'POST', body: JSON.stringify({ barcode: decodedText }) });
            
            // 진동 피드백 (스마트폰 기기 지원 시)
            if (navigator.vibrate) navigator.vibrate(200);
        }

        // 바코드 스캔 실패 시 (매 프레임마다 인식 실패할 때도 호출되므로 보통 비워둠)
        function onScanFailure(error) {
            // console.warn(`스캔 실패 = ${error}`);
        }

        // 스캐너 설정 및 구동
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, // 초당 프레임 수
                qrbox: { width: 250, height: 150 }, // 스캔 가이드 박스 크기
                aspectRatio: 1.0
            },
            /* verbose= */ false
        );
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
