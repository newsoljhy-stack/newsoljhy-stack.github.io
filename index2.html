<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 바코드 스캐너</title>
    <!-- html5-qrcode 최신 안정화 CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f5f5f5; }
        
        /* 스캐너 박스 디자인 커스텀 */
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border: 2px solid #333 !important; border-radius: 8px; overflow: hidden; background: #000; }
        #reader button { padding: 10px 20px; font-size: 1rem; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        #reader select { padding: 8px; margin: 5px; border-radius: 4px; }
        
        /* 결과창 디자인 */
        #result { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; color: #555; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); word-break: break-all; }
        .success-text { color: #28a745; }
    </style>
</head>
<body>

    <h1>바코드 스캐너</h1>
    
    <!-- 라이브러리가 UI를 직접 제어하는 영역 -->
    <div id="reader"></div>
    
    <!-- 스캔 결과만 따로 보여주는 독립된 영역 -->
    <div id="result">카메라 시작 버튼을 눌러주세요.</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    
    // 반응형 스캔 영역 정의 (화면 너비의 70% 수준으로 직사각형 박스 생성)
    const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
        const minEdgePercentage = 0.7; 
        const boxWidth = Math.floor(viewfinderWidth * minEdgePercentage);
        const boxHeight = Math.floor(boxWidth * 0.5); // 2:1 비율의 직사각형
        return {
            width: boxWidth,
            height: boxHeight
        };
    }

    // 스캐너 설정 최적화
    const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
            fps: 15, // 프레임을 15로 약간 상향하여 모바일 추적력 향상
            qrbox: qrboxFunction, 
            aspectRatio: 1.333334, // 모바일 후면 카메라 표준 비율 (4:3) 적용
            rememberLastUsedCamera: true,
            supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
            
            // [중요] 지원할 바코드 포맷을 명시하여 알고리즘 연산량 축소 (인식 속도 급상승)
            formatsToSupport: [ 
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.QR_CODE // 필요 없다면 제외 가능
            ]
        },
        /* verbose= */ false
    );

    // 스캔 성공 시 콜백 함수
    function onScanSuccess(decodedText, decodedResult) {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `스캔 결과: <span class="success-text">${decodedText}</span>`;
        
        // 모바일 진동 피드백
        if (navigator.vibrate) {
            navigator.vibrate(100);
        }
    }

    // 스캔 실패 시 콜백 함수 (과부하 방지를 위해 비워둠)
    function onScanFailure(error) {
        // 무시
    }

    // 스캐너 렌더링
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    
    setTimeout(() => {
        const resultDiv = document.getElementById('result');
        resultDiv.innerText = "상단 스캐너 화면의 안내에 따라주세요.";
    }, 100);
});
</script>
</body>
</html>
