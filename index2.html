<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Barcode Scanner MQTT Publisher</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Html5 QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- mqtt.js -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body{
    font-family:sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
}

#reader{
    width:100%;
    max-width:420px;
    margin:auto;
    border:2px solid #444;
    border-radius:10px;
    overflow:hidden;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    color:#2b7a2b;
    word-break:break-all;
}

#mqtt-status{
    margin:15px;
    font-weight:bold;
    color:red;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>

</head>
<body>

<h2>📷 Barcode Scanner MQTT Publisher</h2>

<div id="mqtt-status">
MQTT 연결 안됨
</div>

<div id="reader"></div>

<div id="result">
바코드를 스캔하세요.
</div>

<script>

//============================
// MQTT 설정
//============================
const brokerUrl = "wss://broker.hivemq.com:8884/mqtt";

const MQTT_TOPIC = "myunique/test/topic";

let client;

function connectMQTT(){

    client = mqtt.connect(brokerUrl,{
        clientId:"web_pub_"+Math.random().toString(16).substring(2,10),
        clean:true,
        reconnectPeriod:3000,
        connectTimeout:5000
    });

    client.on("connect",()=>{

        document.getElementById("mqtt-status").innerHTML="MQTT 연결 완료";
        document.getElementById("mqtt-status").style.color="green";

    });

    client.on("error",(err)=>{

        console.error(err);

        document.getElementById("mqtt-status").innerHTML="MQTT 연결 실패";
        document.getElementById("mqtt-status").style.color="red";

    });

}


//============================
// Publish
//============================
function publishBarcode(barcode){

    if(!client || !client.connected){
        alert("MQTT가 연결되지 않았습니다.");
        return;
    }

    client.publish(
        "myunique/test/topic",
        barcode,
        {qos:0},
        (err)=>{

            if(err){
                console.error(err);
                return;
            }

            console.log("Publish:",barcode);

        }
    );

}


//============================
// Barcode Scanner
//============================
function startScanner(){

    const scanner=new Html5QrcodeScanner(
        "reader",
        {
            fps:10,
            qrbox:{width:280,height:140},
            aspectRatio:1.0,
            rememberLastUsedCamera:true
        },
        false
    );

    scanner.render(

    function(decodedText){

        document.getElementById("result").innerHTML=
            decodedText;

        publishBarcode(decodedText);

    },

    function(error){}
    );

}



//============================
// 시작
//============================
window.onload=function(){

    connectMQTT();

    startScanner();

};

</script>

</body>
</html>
